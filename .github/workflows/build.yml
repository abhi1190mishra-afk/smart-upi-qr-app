name: Build Offline Android APK

on:
  push:
    branches: [ "**" ]
  workflow_dispatch:

jobs:
  build:
    name: Build Smart UPI QR APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Extract Project ZIP
        run: |
          echo "Files in repository:"
          ls -la
          if compgen -G "*.zip" > /dev/null; then
            echo "Found zip file, extracting..."
            unzip -o *.zip
          fi
          ls -la

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK Licenses
        run: |
          echo "Accepting Android SDK licenses..."
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Configure Android SDK and Fix Gradle Scripts
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties

          cat << 'EOF' > settings.gradle
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.PREFER_SETTINGS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "SmartUPIQRPro"
          include ':app'
          EOF

          cat << 'EOF' > build.gradle
          plugins {
              id 'com.android.application' version '8.2.2' apply false
          }
          task clean(type: Delete) {
              delete rootProject.buildDir
          }
          EOF

          cat << 'EOF' > app/build.gradle
          plugins {
              id 'com.android.application'
          }
          android {
              namespace 'com.smartupi.qrpro'
              compileSdk 34
              defaultConfig {
                  applicationId "com.smartupi.qrpro"
                  minSdk 21
                  targetSdk 34
                  versionCode 1
                  versionName "1.0.0"
              }
              buildTypes {
                  release {
                      minifyEnabled false
                  }
                  debug {
                      debuggable true
                  }
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }
          dependencies {
              implementation 'androidx.appcompat:appcompat:1.6.1'
              implementation 'androidx.webkit:webkit:1.10.0'
          }
          EOF

          # Clean safe theme without external dependency issues
          cat << 'EOF' > app/src/main/res/values/themes.xml
          <resources>
              <style name="Theme.SmartUPIQRPro" parent="Theme.AppCompat.DayNight.NoActionBar">
                  <item name="android:statusBarColor">#090d16</item>
                  <item name="android:navigationBarColor">#090d16</item>
                  <item name="android:windowBackground">#090d16</item>
              </style>
          </resources>
          EOF

          # Clean vector app icon
          cat << 'EOF' > app/src/main/res/drawable/ic_launcher.xml
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp"
              android:height="108dp"
              android:viewportWidth="108"
              android:viewportHeight="108">
              <path
                  android:fillColor="#4F46E5"
                  android:pathData="M0,0h108v108h-108z"/>
              <path
                  android:fillColor="#FFFFFF"
                  android:pathData="M24,24h60v60h-60zM32,32h16v16h-16zM60,32h16v16h-16zM32,60h16v16h-16z"/>
          </vector>
          EOF

          # Clean manifest
          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.CAMERA" />
              <uses-feature android:name="android.hardware.camera" android:required="false" />
              <uses-feature android:name="android.hardware.camera.autofocus" android:required="false" />
              <application
                  android:allowBackup="true"
                  android:icon="@drawable/ic_launcher"
                  android:label="@string/app_name"
                  android:supportsRtl="true"
                  android:theme="@style/Theme.SmartUPIQRPro"
                  android:hardwareAccelerated="true">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:configChanges="orientation|screenSize|screenLayout|keyboardHidden"
                      android:windowSoftInputMode="adjustResize">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

      - name: Download Offline Libraries for App
        run: |
          mkdir -p app/src/main/assets/libs
          echo "Downloading Tailwind CSS..."
          curl -s -L https://cdn.tailwindcss.com -o app/src/main/assets/libs/tailwindcss.js
          echo "Downloading Lucide icons..."
          curl -s -L https://unpkg.com/lucide@latest/dist/umd/lucide.js -o app/src/main/assets/libs/lucide.js
          echo "Downloading QRCodeJS..."
          curl -s -L https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js -o app/src/main/assets/libs/qrcode.min.js
          echo "Downloading jsQR..."
          curl -s -L https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.min.js -o app/src/main/assets/libs/jsqr.min.js
          echo "Downloading jsPDF..."
          curl -s -L https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js -o app/src/main/assets/libs/jspdf.umd.min.js
          echo "Downloading jsPDF-AutoTable..."
          curl -s -L https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js -o app/src/main/assets/libs/jspdf.plugin.autotable.min.js

          for f in app/src/main/assets/*.html; do
            if [ -f "$f" ]; then
              echo "Patching offline libraries in $f"
              sed -i 's|https://cdn.tailwindcss.com|libs/tailwindcss.js|g' "$f"
              sed -i 's|https://unpkg.com/lucide@latest|libs/lucide.js|g' "$f"
              sed -i 's|https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js|libs/qrcode.min.js|g' "$f"
              sed -i 's|https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.min.js|libs/jsqr.min.js|g' "$f"
              sed -i 's|https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js|libs/jspdf.umd.min.js|g' "$f"
              sed -i 's|https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js|libs/jspdf.plugin.autotable.min.js|g' "$f"
            fi
          done

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.4'

      - name: Build APK with Gradle
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Prepare APK for Download
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk Smart_UPI_QR_Studio_Pro.apk

      - name: Upload APK to GitHub Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Smart_UPI_QR_Studio_Pro-APK
          path: Smart_UPI_QR_Studio_Pro.apk
          retention-days: 30
