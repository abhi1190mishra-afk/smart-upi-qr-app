name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Gradle 8.7
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: '8.7'

    - name: Auto-Unzip and Build APK
      run: |
        # 1. Agar repository me koi bhi ZIP file hai, use auto-extract karein
        for f in *.zip; do
          if [ -f "$f" ]; then
            echo "Unzipping $f..."
            unzip -o -q "$f"
          fi
        done

        # 2. settings.gradle.kts ko check karein
        if [ -f "settings.gradle.kts" ]; then
          gradle assembleDebug --stacktrace
        else
          PROJECT_DIR=$(find . -name "settings.gradle.kts" -not -path "*/.*" -exec dirname {} \; | head -n 1)
          if [ -n "$PROJECT_DIR" ]; then
            cd "$PROJECT_DIR"
            gradle assembleDebug --stacktrace
          else
            if [ -d "app" ]; then
              cat << 'EOF' > settings.gradle.kts
pluginManagement {
    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}
dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
    repositories {
        google()
        mavenCentral()
    }
}
rootProject.name = "UPI-QR-Generator"
include(":app")
EOF
              gradle assembleDebug --stacktrace
            else
              echo "ERROR: Neither settings.gradle.kts nor zip archive found!"
              exit 1
            fi
          fi
        fi

    - name: Upload Debug APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: UPI-Pay-QR-APK
        path: "**/app/build/outputs/apk/debug/*.apk"
        retention-days: 14
