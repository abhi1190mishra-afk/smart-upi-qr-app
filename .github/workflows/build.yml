name: Build Offline Android APK

on:
  push:
    branches: [ "**" ]
  workflow_dispatch:

jobs:
  build:
    name: Build Smart UPI QR APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Extract Project ZIP
        run: |
          echo "Files in repository:"
          ls -la
          if compgen -G "*.zip" > /dev/null; then
            echo "Found zip file, extracting..."
            unzip -o *.zip
          fi
          # Clean up any duplicate xml icon files
          rm -f app/src/main/res/drawable/ic_launcher.xml
          rm -f app/src/main/res/drawable/ic_launcher_background.xml
          rm -f app/src/main/res/drawable/ic_launcher_foreground.xml
          rm -rf app/src/main/res/mipmap-anydpi-v26
          ls -la

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK Licenses
        run: |
          mkdir -p "$ANDROID_HOME/licenses" || true
          echo "24333f8a63b6825ea9c5514f83c2829b004d1fee" > "$ANDROID_HOME/licenses/android-sdk-license" || true
          echo "84831b9409646a918e30573bab4c9c91346d8abd" > "$ANDROID_HOME/licenses/android-sdk-preview-license" || true

      - name: Configure Android SDK and Fix Gradle Scripts
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          echo "android.useAndroidX=true" > gradle.properties

          cat << 'EOF' > settings.gradle
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.PREFER_SETTINGS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "SmartUPIQRPro"
          include ':app'
          EOF

          cat << 'EOF' > build.gradle
          plugins {
              id 'com.android.application' version '8.2.2' apply false
          }
          task clean(type: Delete) {
              delete rootProject.buildDir
          }
          EOF

          cat << 'EOF' > app/build.gradle
          plugins {
              id 'com.android.application'
          }
          android {
              namespace 'com.smartupi.qrpro'
              compileSdk 34
              defaultConfig {
                  applicationId "com.smartupi.qrpro"
                  minSdk 21
                  targetSdk 34
                  versionCode 1
                  versionName "1.0.0"
              }
              buildTypes {
                  release {
                      minifyEnabled false
                  }
                  debug {
                      debuggable true
                  }
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }
          dependencies {
              implementation 'androidx.appcompat:appcompat:1.6.1'
              implementation 'androidx.webkit:webkit:1.10.0'
              implementation 'androidx.biometric:biometric:1.1.0'
          }
          EOF

          cat << 'EOF' > app/src/main/res/values/themes.xml
          <resources>
              <style name="Theme.SmartUPIQRPro" parent="Theme.AppCompat.DayNight.NoActionBar">
                  <item name="android:statusBarColor">#090d16</item>
                  <item name="android:navigationBarColor">#090d16</item>
                  <item name="android:windowBackground">#090d16</item>
              </style>
          </resources>
          EOF

      - name: Download Offline Libraries for App
        run: |
          mkdir -p app/src/main/assets/libs
          echo "Downloading QRCodeJS..."
          curl -s -L https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js -o app/src/main/assets/libs/qrcode.min.js

          for f in app/src/main/assets/*.html; do
            if [ -f "$f" ]; then
              echo "Patching offline libraries in $f"
              sed -i 's|https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js|libs/qrcode.min.js|g' "$f"
            fi
          done

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.4'

      - name: Build APK with Gradle
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Prepare APK for Download
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk Smart_UPI_QR_Studio_Pro.apk

      - name: Upload APK to GitHub Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Smart_UPI_QR_Studio_Pro-APK
          path: Smart_UPI_QR_Studio_Pro.apk
          retention-days: 30
