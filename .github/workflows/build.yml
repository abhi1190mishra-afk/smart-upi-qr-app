name: Build Offline Android APK

on:
  push:
    branches: [ "**" ]
  workflow_dispatch:

jobs:
  build:
    name: Build Smart UPI QR APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Extract Project ZIP
        run: |
          unzip -o Smart_UPI_QR_Android_Project.zip

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Download Offline Libraries for App
        run: |
          mkdir -p app/src/main/assets/libs
          curl -s -L https://cdn.tailwindcss.com -o app/src/main/assets/libs/tailwindcss.js
          curl -s -L https://unpkg.com/lucide@latest/dist/umd/lucide.js -o app/src/main/assets/libs/lucide.js
          curl -s -L https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js -o app/src/main/assets/libs/qrcode.min.js
          curl -s -L https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.min.js -o app/src/main/assets/libs/jsqr.min.js
          curl -s -L https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js -o app/src/main/assets/libs/jspdf.umd.min.js
          curl -s -L https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js -o app/src/main/assets/libs/jspdf.plugin.autotable.min.js
          
          sed -i 's|https://cdn.tailwindcss.com|libs/tailwindcss.js|g' app/src/main/assets/index.html
          sed -i 's|https://unpkg.com/lucide@latest|libs/lucide.js|g' app/src/main/assets/index.html
          sed -i 's|https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js|libs/qrcode.min.js|g' app/src/main/assets/index.html
          sed -i 's|https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.min.js|libs/jsqr.min.js|g' app/src/main/assets/index.html
          sed -i 's|https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js|libs/jspdf.umd.min.js|g' app/src/main/assets/index.html
          sed -i 's|https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js|libs/jspdf.plugin.autotable.min.js|g' app/src/main/assets/index.html

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.4'

      - name: Build APK with Gradle
        run: gradle assembleDebug --stacktrace

      - name: Prepare APK for Download
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk Smart_UPI_QR_Studio_Pro.apk

      - name: Upload APK to GitHub Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Smart_UPI_QR_Studio_Pro-APK
          path: Smart_UPI_QR_Studio_Pro.apk
          retention-days: 30
          
